# =============================================================================
# GridNexus – Production Docker Compose Override (docker-compose.prod.yml)
# 
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# =============================================================================

services:
  postgres:
    restart: always
    environment:
      POSTGRES_USER: gridnexus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: gridnexus
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  redis:
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
        reservations:
          cpus: '0.2'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  engine:
    restart: always
    environment:
      GRIDNEXUS_MODE: production
      DATABASE_URL: postgresql+asyncpg://gridnexus:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/gridnexus
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET:?Set JWT_SECRET}
      ENGINE_JWT_SECRET: ${ENGINE_JWT_SECRET:?Set ENGINE_JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS}
      LLM_API_KEY: ${LLM_API_KEY:-}
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4096M
        reservations:
          cpus: '1.0'
          memory: 1024M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  broker:
    restart: always
    environment:
      GRIDNEXUS_MODE: production
      NODE_ENV: production
      DATABASE_URL: postgresql://gridnexus:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/gridnexus
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379/0
      ENGINE_URL: http://engine:8000
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      ENGINE_JWT_SECRET: ${ENGINE_JWT_SECRET:?Set ENGINE_JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS}
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  broker-worker:
    restart: always
    environment:
      GRIDNEXUS_MODE: production
      NODE_ENV: production
      DATABASE_URL: postgresql://gridnexus:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/gridnexus
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379/0
      ENGINE_URL: http://engine:8000
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      ENGINE_JWT_SECRET: ${ENGINE_JWT_SECRET:?Set ENGINE_JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS}
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  command-center:
    build:
      args:
        VITE_GRIDNEXUS_MODE: production
        VITE_DEMO_MODE: "false"
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
