# ==============================================================================
# GridNexus: Kubernetes Secret Template (deploy/k8s/secret.template.yaml)
# 
# IMPORTANT: DO NOT commit real secrets to Git.
# Generate real secret via:
#   kubectl create secret generic gridnexus-secrets \
#     --namespace=gridnexus \
#     --from-literal=database-url='postgresql://user:pass@postgres:5432/gridnexus' \
#     --from-literal=postgres-password='<SECURE_PASSWORD>' \
#     --from-literal=jwt-secret='<RANDOM_64_CHAR_HEX>' \
#     --from-literal=llm-api-key='<YOUR_API_KEY>' \
#     --dry-run=client -o yaml > secret.prod.yaml
# ==============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: gridnexus-secrets
  namespace: gridnexus
  labels:
    app.kubernetes.io/name: gridnexus
    app.kubernetes.io/part-of: gridnexus-vpp
type: Opaque
stringData:
  # Database credentials
  POSTGRES_USER: "gridnexus"
  POSTGRES_PASSWORD: "REPLACE_WITH_SECURE_POSTGRES_PASSWORD"
  POSTGRES_DB: "gridnexus"
  DATABASE_URL: "postgresql://gridnexus:REPLACE_WITH_SECURE_POSTGRES_PASSWORD@postgres:5432/gridnexus"
  
  # Redis URL
  REDIS_URL: "redis://redis:6379/0"
  
  # Security tokens & API keys
  JWT_SECRET: "REPLACE_WITH_SECURE_JWT_SECRET_KEY"
  LLM_API_KEY: "REPLACE_WITH_SECURE_LLM_API_KEY"
