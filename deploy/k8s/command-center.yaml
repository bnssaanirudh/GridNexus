apiVersion: apps/v1
kind: Deployment
metadata:
  name: command-center
  namespace: gridnexus
  labels:
    app.kubernetes.io/name: command-center
    app.kubernetes.io/part-of: gridnexus-vpp
    app.kubernetes.io/component: layer3-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: command-center
  template:
    metadata:
      labels:
        app: command-center
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
      containers:
        - name: command-center
          image: gridnexus/command-center:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5173
              name: http
          resources:
            limits:
              cpu: "1000m"
              memory: "512Mi"
            requests:
              cpu: "100m"
              memory: "128Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 5173
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 5173
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: command-center
  namespace: gridnexus
  labels:
    app.kubernetes.io/name: command-center
spec:
  type: NodePort
  ports:
    - port: 5173
      targetPort: 5173
      nodePort: 30173
      name: http
  selector:
    app: command-center
