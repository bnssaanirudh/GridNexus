name: "GridNexus Ablation Studies"
description: "Rigorous ablation matrix comparing Random, Independent PPO, and MAPPO, with and without the Semantic Oracle."
output_dir: "artifacts/experiments"

scenarios:
  - name: "baseline-random"
    description: "No RL, no Oracle (Random behavior)."
    seeds: [42, 101, 202, 303, 404]
    oracle_enabled: false
    rl_agent_type: "random"
    num_episodes: 50
    steps_per_episode: 20

  - name: "ippo-no-oracle"
    description: "Standard IPPO (decentralized critic), no RAG stability insights."
    seeds: [42, 101, 202, 303, 404]
    oracle_enabled: false
    rl_agent_type: "ippo"
    num_episodes: 50
    steps_per_episode: 20

  - name: "mappo-no-oracle"
    description: "MAPPO (Centralized critic), no RAG stability insights."
    seeds: [42, 101, 202, 303, 404]
    oracle_enabled: false
    rl_agent_type: "mappo"
    num_episodes: 50
    steps_per_episode: 20

  - name: "ippo-oracle"
    description: "IPPO with RAG Oracle signals."
    seeds: [42, 101, 202, 303, 404]
    oracle_enabled: true
    rl_agent_type: "ippo"
    num_episodes: 50
    steps_per_episode: 20

  - name: "mappo-oracle"
    description: "Proposed Architecture: MAPPO with RAG Oracle signals."
    seeds: [42, 101, 202, 303, 404]
    oracle_enabled: true
    rl_agent_type: "mappo"
    num_episodes: 50
    steps_per_episode: 20

metrics:
  - "mean_coalition_size"
  - "mean_surplus_captured"
  - "fairness_violation_rate"
  - "mean_stability_margin"
