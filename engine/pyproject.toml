[tool.poetry]
name = "gridnexus-engine"
version = "0.1.0"
description = "GridNexus Layer 1 – Mathematical & AI core (FastAPI, LangChain, DQN, MAPPO)"
authors = ["GridNexus Team"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.30.0"}
pydantic = "^2.0"
pydantic-settings = "^2.0"
sqlalchemy = "^2.0.51"
asyncpg = "^0.31.0"
structlog = "^26.1.0"
redis = "^8.1.0"
tenacity = "^9.0.0"
scipy = {version = ">=1.11,<1.15", python = ">=3.11,<3.12"}
networkx = ">=3.4,<3.6.1"
shapely = "^2.1.2"
matplotlib = "^3.11.1"
langchain = "^1.3.14"
langchain-core = "^1.5.3"
numpy = "<2"
pettingzoo = {version = ">=1.26.1", python = ">=3.11,<3.15"}
gymnasium = {version = ">=1.3.0", python = ">=3.11,<3.15"}
sentence-transformers = ">=2.2,<3"
pgvector = "^0.5.0"
psycopg2-binary = "^2.9.12"

[tool.poetry.group.dev.dependencies]
pytest = ">=9.0.3"
pytest-asyncio = ">=0.25.0"
httpx = "^0.27.0"
ruff = "^0.5.0"
hypothesis = "^6.164.0"
pytest-cov = "^7.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]
ignore = ["B008", "E501", "N815", "E712", "N806", "N803", "RUF002", "RUF003", "F401"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=app.graph.planar_graph --cov=app.stability.stability_solver --cov-report=xml --cov-report=term-missing --cov-fail-under=85"
